<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>한국어 ↔ 日本語 ｜ 双方向フレーズ学習帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#e6ece6;
    --paper-deep:#d8e2da;
    --card:#ffffff;
    --ink:#16211c;
    --ink-soft:#5d6d64;
    --ink-faint:#8b998f;
    --line:#c7d5cb;
    --line-soft:#e1e9e2;
    --red:#b5372a;
    --red-deep:#8f2a20;
    --jade:#2f7d6b;
    --gold:#9a6b1e;
    --serif:"Noto Serif KR",serif;
    --sans:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --r:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.55;padding:0 0 104px}
  .wrap{max-width:880px;margin:0 auto;padding:0 16px}

  .masthead{padding:24px 0 16px;border-bottom:2px solid var(--ink)}
  .masthead h1{font-family:var(--serif);font-weight:900;font-size:1.7rem;letter-spacing:-.01em;line-height:1.25}
  .masthead h1 .arw{font-family:var(--sans);color:var(--red);font-weight:500;padding:0 .18em;font-size:.8em;vertical-align:.08em}
  .masthead p{margin-top:6px;font-size:.85rem;color:var(--ink-soft)}

  .switch-block{margin:16px 0 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .switch-label{font-size:.74rem;color:var(--ink-faint);margin-bottom:8px}
  .switch-label.second{margin-top:14px}
  .dir{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
  .dir button{font-family:var(--serif);font-weight:600;font-size:.98rem;padding:12px 8px;background:var(--card);border:none;color:var(--ink-soft);cursor:pointer;transition:background .12s,color .12s}
  .dir button+button{border-left:1.5px solid var(--ink)}
  .dir button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .dir small{display:block;font-family:var(--sans);font-size:.68rem;font-weight:400;opacity:.78;margin-top:2px}
  #dirSwitch button{font-size:.92rem;padding:11px 6px}

  .modes{display:flex;gap:6px;margin-top:14px}
  .modes button{flex:1;font-size:.84rem;font-weight:500;padding:9px 4px;background:transparent;border:1px solid var(--line);border-radius:6px;color:var(--ink-soft);cursor:pointer}
  .modes button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}

  .toolbar{margin-top:14px}
  .searchrow input{width:100%;font-family:var(--sans);font-size:.95rem;padding:11px 13px;background:var(--card);border:1px solid var(--line);border-radius:6px;color:var(--ink);outline:none}
  .searchrow input:focus{border-color:var(--jade);box-shadow:0 0 0 3px rgba(47,125,107,.13)}
  .btnrow{display:flex;gap:6px;margin-top:8px}
  .ghost{flex:1;font-family:var(--sans);font-size:.82rem;font-weight:500;padding:9px 6px;white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:6px;color:var(--ink);cursor:pointer}
  .ghost[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

  .cats{display:flex;gap:6px;overflow-x:auto;padding:12px 0 8px;scrollbar-width:none;position:sticky;top:0;z-index:20;background:linear-gradient(var(--paper) 78%,rgba(230,236,230,0))}
  .cats::-webkit-scrollbar{display:none}
  .cats button{white-space:nowrap;font-size:.82rem;padding:7px 13px;background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--ink-soft);cursor:pointer}
  .cats button[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:#fff;font-weight:700}

  .meterrow{display:flex;align-items:center;gap:10px;padding:4px 0 14px;font-size:.76rem;color:var(--ink-soft)}
  .meter{flex:1;height:5px;background:var(--paper-deep);border-radius:99px;overflow:hidden}
  .meter i{display:block;height:100%;background:var(--jade);width:0;transition:width .3s}
  .meterrow .ghost{flex:0 0 auto;font-size:.74rem;padding:5px 9px}

  .entry{display:grid;grid-template-columns:34px 1fr 1fr 42px;background:var(--card);border:1px solid var(--line-soft);border-bottom:none}
  .entry:first-of-type{border-radius:var(--r) var(--r) 0 0}
  .entry:last-of-type{border-bottom:1px solid var(--line-soft);border-radius:0 0 var(--r) var(--r)}
  .entry.done{background:#f4f8f4}
  .entry.playing{background:#fdf6ec;box-shadow:inset 3px 0 0 var(--gold)}
  .side{padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .side button{background:none;border:none;cursor:pointer;font-size:1.15rem;line-height:1;padding:2px;color:var(--ink-faint)}
  .side.right{justify-content:flex-start;gap:10px}
  .side .play{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:1rem;display:flex;align-items:center;justify-content:center}
  .side .play:hover{background:var(--jade);border-color:var(--jade)}
  .side .star.on{color:#c99a13}
  .side .chk.on{color:var(--jade)}
  .entry>.side:first-child{grid-column:1;grid-row:1}
  .entry>.a-cell{grid-column:2;grid-row:1;padding:13px 10px 13px 2px}
  .entry>.b-cell{grid-column:3;grid-row:1;padding:13px 6px 13px 14px;border-left:1px solid var(--line-soft)}
  .entry>.side.right{grid-column:4;grid-row:1}
  .ko{font-family:var(--serif);font-weight:600;font-size:1.18rem;line-height:1.4;word-break:keep-all}
  .jp{font-family:var(--sans);font-weight:700;font-size:1.1rem;line-height:1.45}
  .kana{font-size:.78rem;color:var(--gold);letter-spacing:.02em;margin-top:3px}
  .hang{font-family:var(--serif);font-size:.8rem;color:var(--jade);margin-top:2px}
  .plain{font-size:.97rem;font-weight:500;word-break:break-word}
  .plain.ko-plain{font-family:var(--serif);font-weight:600;font-size:1.05rem}
  .tip{font-size:.76rem;color:var(--ink-soft);margin-top:4px}
  .mask{width:100%;text-align:left;font-family:var(--sans);font-size:.82rem;color:var(--ink-faint);background:repeating-linear-gradient(45deg,#eef2ee,#eef2ee 6px,#e6ece6 6px,#e6ece6 12px);border:1px dashed var(--line);border-radius:5px;padding:12px 10px;cursor:pointer}
  .mask:hover{color:var(--ink)}

  .empty{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--r);padding:44px 20px;text-align:center;color:var(--ink-soft);font-size:.9rem}
  .empty b{display:block;font-size:1rem;color:var(--ink);margin-bottom:6px}
  .foot{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:.76rem;color:var(--ink-faint)}

  .card-stage{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px 20px 20px;text-align:center;min-height:250px;display:flex;flex-direction:column;justify-content:center}
  .card-idx{font-size:.74rem;color:var(--ink-faint);margin-bottom:14px}
  .card-q{font-family:var(--serif);font-weight:900;font-size:1.8rem;line-height:1.35;word-break:keep-all}
  .card-q.jp-q{font-family:var(--sans);font-weight:900;font-size:1.5rem}
  .card-sub{font-size:.88rem;color:var(--gold);margin-top:8px}
  .card-sub.h{font-family:var(--serif);color:var(--jade);font-size:.85rem;margin-top:2px}
  .card-rule{width:44px;height:2px;background:var(--line);margin:18px auto}
  .card-a{font-size:1.2rem;font-weight:500}
  .card-a .ko{font-size:1.55rem}
  .card-a .jp{font-size:1.35rem}
  .card-tip{font-size:.82rem;color:var(--ink-soft);margin-top:10px}
  .card-hint{font-size:.8rem;color:var(--ink-faint)}
  .card-bar{display:flex;gap:8px;margin-top:12px}
  .card-bar button{flex:1;font-size:.9rem;font-weight:700;padding:14px 6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .card-bar .know{background:var(--jade);border-color:var(--jade);color:#fff}
  .card-bar .again{background:var(--red);border-color:var(--red);color:#fff}
  .card-bar .dark{background:var(--ink);border-color:var(--ink);color:#fff}
  .card-nav{display:flex;gap:8px;margin-top:8px}
  .card-nav button{flex:1;font-size:.84rem;padding:10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);cursor:pointer}

  .quiz-stage{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
  .quiz-top{display:flex;justify-content:space-between;font-size:.74rem;color:var(--ink-faint);margin-bottom:12px}
  .quiz-q{font-family:var(--serif);font-weight:900;font-size:1.55rem;text-align:center;padding:10px 0 4px;word-break:keep-all}
  .quiz-q.jp-q{font-family:var(--sans);font-weight:900;font-size:1.3rem}
  .quiz-sub{text-align:center;font-size:.8rem;color:var(--gold);margin-bottom:16px}
  .opt{display:block;width:100%;text-align:left;margin-top:8px;padding:13px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer;font-family:var(--sans);font-size:.95rem;color:var(--ink);line-height:1.4}
  .opt .opt-ko{font-family:var(--serif);font-weight:600;font-size:1.05rem}
  .opt .opt-jp{font-weight:700;font-size:1.02rem}
  .opt:hover{border-color:var(--jade)}
  .opt.right{background:#eaf4f0;border-color:var(--jade);font-weight:700}
  .opt.wrong{background:#fbecea;border-color:var(--red)}
  .quiz-fb{margin-top:14px;font-size:.86rem;color:var(--ink-soft);min-height:22px}
  .result{text-align:center;padding:20px 6px}
  .result .score{font-family:var(--serif);font-weight:900;font-size:3rem;color:var(--jade);line-height:1}
  .result p{font-size:.9rem;color:var(--ink-soft);margin:10px 0 18px}
  .btn-main{font-size:.92rem;font-weight:700;padding:13px 22px;background:var(--red);color:#fff;border:none;border-radius:6px;cursor:pointer}
  .btn-main:hover{background:var(--red-deep)}

  .audiobar{position:fixed;left:0;right:0;bottom:0;background:rgba(22,33,28,.97);color:#dfe8e2;padding:9px 14px;z-index:50}
  .audiobar .wrapbar{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:8px;width:100%;flex-wrap:wrap}
  .audiobar button{font-family:var(--sans);font-size:.8rem;font-weight:600;padding:8px 11px;border-radius:5px;border:1px solid #46564d;background:transparent;color:#dfe8e2;cursor:pointer}
  .audiobar button.on{background:var(--red);border-color:var(--red);color:#fff}
  .audiobar select{font-family:var(--sans);font-size:.76rem;padding:6px 6px;border-radius:5px;border:1px solid #46564d;background:#22322b;color:#dfe8e2;outline:none;max-width:8.5em}
  .audiobar .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#9fb3a7;font-size:.75rem}
  .audiobar .warn{color:#f0b8a8}
  .helppanel{display:none;max-width:880px;margin:0 auto;padding:10px 2px 4px;font-size:.76rem;line-height:1.6;color:#bccdc3;max-height:46vh;overflow:auto}
  .helppanel.open{display:block}
  .helppanel b{color:#fff}

  a{color:var(--jade)}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  @media (max-width:620px){
    .masthead h1{font-size:1.4rem}
    .entry{grid-template-columns:30px 1fr 42px}
    .entry>.side:first-child{grid-column:1;grid-row:1}
    .entry>.a-cell{grid-column:2;grid-row:1;padding:12px 6px 6px 2px}
    .entry>.side.right{grid-column:3;grid-row:1}
    .entry>.b-cell{grid-column:1/4;grid-row:2;border-left:none;border-top:1px dashed var(--line-soft);padding:9px 12px 13px 38px}
    .side{padding:12px 4px 6px}
    .card-q{font-size:1.5rem}
    .audiobar{padding:8px 10px}
    .audiobar .grow{flex:1 1 100%;order:9;white-space:normal;line-height:1.35}
    .audiobar button{padding:8px 9px;font-size:.76rem}
    .audiobar select{font-size:.7rem;max-width:5.4em;padding:6px 2px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>한국어<span class="arw">↔</span>日本語</h1>
    <p id="subtitle"></p>
  </header>

  <section class="switch-block">
    <div class="switch-label" id="lblLearner"></div>
    <div class="dir" id="uiSwitch">
      <button data-ui="ja" aria-pressed="true">한국어 학습<small id="uiSubJa"></small></button>
      <button data-ui="ko" aria-pressed="false">일본어 학습<small id="uiSubKo"></small></button>
    </div>
    <div class="switch-label second" id="lblDir"></div>
    <div class="dir" id="dirSwitch">
      <button data-dir="t2n" aria-pressed="true"><span id="dirA"></span><small id="dirAs"></small></button>
      <button data-dir="n2t" aria-pressed="false"><span id="dirB"></span><small id="dirBs"></small></button>
    </div>
    <div class="modes" id="modeSwitch">
      <button data-mode="list" aria-pressed="true"></button>
      <button data-mode="card" aria-pressed="false"></button>
      <button data-mode="quiz" aria-pressed="false"></button>
    </div>
  </section>

  <div class="toolbar">
    <div class="searchrow"><input id="q" type="search" autocomplete="off"></div>
    <div class="btnrow">
      <button class="ghost" id="maskBtn" aria-pressed="false"></button>
      <button class="ghost" id="shuffleBtn" aria-pressed="false"></button>
      <button class="ghost" id="tipBtn" aria-pressed="true"></button>
    </div>
    <nav class="cats" id="cats"></nav>
    <div class="meterrow">
      <span id="meterLabel"></span>
      <span class="meter"><i id="meterFill"></i></span>
      <button class="ghost" id="resetBtn"></button>
    </div>
  </div>

  <main id="stage"></main>
  <div class="foot">
    <span id="footLeft"></span>
    <span id="footRight"></span>
  </div>
</div>

<div class="audiobar">
  <div class="wrapbar">
    <button id="autoBtn"></button>
    <select id="voiceMode"><option value="target"></option><option value="both"></option></select>
    <select id="rate">
      <option value="0.7">0.7x</option><option value="0.85">0.85x</option>
      <option value="1" selected>1.0x</option><option value="1.2">1.2x</option>
    </select>
    <select id="engine">
      <option value="google" selected></option><option value="auto"></option><option value="local"></option>
    </select>
    <span class="grow" id="audioStatus"></span>
    <button id="helpBtn">?</button>
  </div>
  <div class="helppanel" id="helpPanel"></div>
</div>

<script>

const KANA_INIT = {"か":"가","き":"기","く":"구","け":"게","こ":"고","た":"다","ち":"지","て":"데","と":"도"};
const DIG = {
  "きゃ":["갸","캬"],"きゅ":["규","큐"],"きょ":["교","쿄"],
  "ぎゃ":["갸","갸"],"ぎゅ":["규","규"],"ぎょ":["교","교"],

  "うぃ":["위","위"],"うぇ":["웨","웨"],"しぇ":["셰","셰"],"じぇ":["제","제"],"ちぇ":["체","체"]

const JONG = {"ㄴ":4,"ㅁ":16,"ㅅ":19,"ㅇ":21};
/* 助詞の「は」（＝わ と発音）の位置。値は文中で何番目の「は」かを表す */
const HA = {1:1,27:1,29:1,31:1,409:1,412:1,441:1,444:1,449:1,450:1,515:1,519:1,520:1,
  524:1,525:1,531:1,539:1,541:1,601:1,604:1,612:1,613:1,617:1,806:1,815:2,821:1,830:1,
  950:1,1034:1,1115:1,1117:1,1119:1,1205:1,1212:1,1223:1,1224:1};
function jungOf(str){
  if(!str) return -1;
  const code = str.charCodeAt(str.length - 1) - 0xac00;
  if(code < 0 || code > 11171) return -1;
  return Math.floor(code / 28) % 21;
}
function markParticle(yomi, id){
  const n = HA[id];
  if(!n) return yomi;
  let seen = 0;
  return yomi.replace(/は/g, m => (++seen === n ? "わ" : m));
}

function toHira(s){
  return String(s).replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
}
function addJong(str, mark){
  if(!str) return str;
  const code = str.charCodeAt(str.length - 1) - 0xac00;
  if(code < 0 || code > 11171 || code % 28 !== 0) return str;
  return str.slice(0, -1) + String.fromCharCode(0xac00 + code + JONG[mark]);
}
function hangulize(text){
  const s = toHira(text);
  let out = "", initial = true;
  for(let i = 0; i < s.length; i++){
    const two = s.substr(i, 2);
    if(DIG[two]){ out += DIG[two][initial ? 0 : 1]; initial = false; i++; continue; }
    const c = s[i];
    if(c === "ん"){
      const nx = s[i+1] || "";
      out = addJong(out, (nx && "まみむめもばびぶべぼぱぴぷぺぽ".indexOf(nx) >= 0) ? "ㅁ" : "ㄴ");
      initial = false; continue;
    }
    if(c === "っ"){ out = addJong(out, "ㅅ"); initial = false; continue; }
    if(c === "ー" || c === "〜"){ continue; }
    if(KANA[c]){
      if("あいうえお".indexOf(c) >= 0){
        const pv = jungOf(out), mj = jungOf(KANA[c]);
        /* 長音（おう・とう・おお など）はハングルでは書かない */
        if(pv >= 0 && pv === mj) continue;
        if(c === "う" && (pv === 8 || pv === 12 || pv === 13 || pv === 17)) continue;
      }
      out += (initial && KANA_INIT[c]) ? KANA_INIT[c] : KANA[c];
      initial = false; continue;
    }
    out += c;
    initial = true;
  }
  return out;
}

/* ==========================================================
   5. 音声（端末TTS → 使えなければGoogle音声へ自動フォールバック）
   ========================================================== */
const Voices = {list: [], warned: false};
function loadVoices(){
  if(!window.speechSynthesis) return;
  const v = window.speechSynthesis.getVoices();
  if(v && v.length) Voices.list = v;
}
function findVoice(lang){
  const p = lang === "ko" ? "ko" : "ja";
  return Voices.list.find(v => String(v.lang || "").toLowerCase().replace("_","-").indexOf(p) === 0) || null;
}
if(window.speechSynthesis){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = () => { loadVoices(); refreshAudioStatus(); };
  [300, 1200, 2500].forEach(ms => setTimeout(() => { loadVoices(); refreshAudioStatus(); }, ms));
}
let unlocked = false;
function unlockSpeech(){
  if(unlocked || !window.speechSynthesis) return;
  unlocked = true;
  try{
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0; window.speechSynthesis.speak(u);
  }catch(e){}
}
document.addEventListener("pointerdown", unlockSpeech, {once:true});
document.addEventListener("keydown", unlockSpeech, {once:true});

function setStatus(msg, warn){
  const el = $("audioStatus");
  el.textContent = msg;
  el.className = "grow" + (warn ? " warn" : "");
}
function refreshAudioStatus(){
  if(S.auto) return;
  const eng = $("engine").value;
  if(eng === "local" && !findVoice(tLang())){ setStatus(t().aNoVoice, true); return; }
  setStatus(t().aIdle, false);
}

function stopAudio(){
  if(S.audio){ try{ S.audio.pause(); }catch(e){} S.audio = null; }
  if(window.speechSynthesis){ try{ window.speechSynthesis.cancel(); }catch(e){} }
}

function speak(text, lang, done){
  stopAudio();
  const rate = parseFloat($("rate").value) || 1;
  const eng = $("engine").value;
  const clean = String(text).replace(/[／·]/g, " ").trim();
  if(eng === "google") return googleSpeak(clean, lang, rate, done, () => localSpeak(clean, lang, rate, done, () => fail(done)));
  if(eng === "local")  return localSpeak(clean, lang, rate, done, () => fail(done));
  /* auto: 端末に音声があれば端末、無ければGoogle */
  if(findVoice(lang)) return localSpeak(clean, lang, rate, done, () => googleSpeak(clean, lang, rate, done, () => fail(done)));
  return googleSpeak(clean, lang, rate, done, () => localSpeak(clean, lang, rate, done, () => fail(done)));
}
function fail(done){
  setStatus(t().aFail, true);
  if(done) done();
}

function localSpeak(text, lang, rate, done, onFail){
  if(!window.speechSynthesis){ return onFail && onFail(); }
  const v = findVoice(lang);
  const u = new SpeechSynthesisUtterance(text);
  if(v) u.voice = v;
  u.lang = v ? v.lang : (lang === "ko" ? "ko-KR" : "ja-JP");
  u.rate = rate; u.volume = 1; u.pitch = 1;
  let started = false, finished = false;
  u.onstart = () => { started = true; setStatus(t().aPlay(text), false); };
  u.onend = () => { if(finished) return; finished = true; if(done) done(); };
  u.onerror = () => { if(finished) return; finished = true; onFail ? onFail() : (done && done()); };
  try{ window.speechSynthesis.cancel(); }catch(e){}
  setTimeout(() => {
    try{ window.speechSynthesis.resume(); window.speechSynthesis.speak(u); }
    catch(e){ if(!finished){ finished = true; onFail && onFail(); } }
  }, 60);
  setTimeout(() => {
    if(!started && !finished){
      finished = true;
      try{ window.speechSynthesis.cancel(); }catch(e){}
      onFail && onFail();
    }
  }, 1600);
}

function googleSpeak(text, lang, rate, done, onFail){
  const tl = lang === "ko" ? "ko" : "ja";
  const q = encodeURIComponent(text.replace(/[?!.,！？、。]/g, "").slice(0, 190));
  const urls = [
    "https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=" + tl + "&q=" + q,
    "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=" + tl + "&q=" + q
  ];
  let idx = 0, finished = false;
  const tryNext = () => {
    if(finished) return;
    if(idx >= urls.length){ finished = true; return onFail && onFail(); }
    const a = new Audio(urls[idx++]);
    S.audio = a;
    a.playbackRate = rate;
    a.onplaying = () => setStatus(t().aPlay(text), false);
    a.onended = () => { if(finished) return; finished = true; S.audio = null; if(done) done(); };
    a.onerror = tryNext;
    a.play().catch(tryNext);
  };
  tryNext();
}

function speakItem(d, done){
  const both = $("voiceMode").value === "both";
  const tl = tLang(), nl = nLang();
  const tText = tl === "ko" ? d.ko : d.ja;
  const nText = nl === "ko" ? d.ko : d.ja;
  if(!both) return speak(tText, tl, done);
  if(S.dir === "t2n") speak(tText, tl, () => setTimeout(() => speak(nText, nl, done), 250));
  else speak(nText, nl, () => setTimeout(() => speak(tText, tl, done), 250));
}

   6. 絞り込み

function visible(){
  const q = S.q.trim().toLowerCase();
  let list = DATA.filter(d => {
    const inCat = S.cat === "all" ? true : S.cat === "fav" ? S.favs.has(d.id) : d.cat === S.cat;
    if(!inCat) return false;
    if(!q) return true;
    return (d.ko + d.kana + d.ja + d.tip + d.yomi + d.tipKo).toLowerCase().includes(q);
  });
  if(S.shuffled){
    const pos = {};
    S.order.forEach((id, i) => pos[id] = i);
    list = list.slice().sort((a, b) => (pos[a.id] ?? 0) - (pos[b.id] ?? 0));
  }
  return list;
}
function reshuffle(){
  S.order = DATA.map(d => d.id);
  for(let i = S.order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [S.order[i], S.order[j]] = [S.order[j], S.order[i]];
  }
}

function startQuiz(){
  const pool = visible();
  if(pool.length < 4){
    stage.innerHTML = '<div class="empty"><b>' + t().emptyQT + '</b>' + t().emptyQB + '</div>';
    S.quiz = null;
    return;
  }
  const picked = pool.slice();
  for(let i = picked.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [picked[i], picked[j]] = [picked[j], picked[i]];
  }
  S.quiz = {
    items: picked.slice(0, Math.min(10, picked.length)).map(d => {
      const wrong = [], used = new Set([d.id]), texts = new Set([d.ja, d.ko]);
      let guard = 0;
      while(wrong.length < 3 && guard++ < 400){
        const c = pool[Math.floor(Math.random() * pool.length)];
        if(used.has(c.id) || texts.has(c.ja) || texts.has(c.ko)) continue;
        used.add(c.id); texts.add(c.ja); texts.add(c.ko); wrong.push(c);
      }
      while(wrong.length < 3){
        const c = pool[Math.floor(Math.random() * pool.length)];
        if(used.has(c.id)) continue;
        used.add(c.id); wrong.push(c);
      }
      const opts = [d, ...wrong];
      for(let i = opts.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [opts[i], opts[j]] = [opts[j], opts[i]];
      }
      return {d, opts};
    }),
    i: 0, score: 0, answered: false, chosen: null
  };
  renderQuiz();
}

function renderQuiz(){
  const Q = S.quiz;
  if(!Q){ return startQuiz(); }
  if(Q.i >= Q.items.length){
    const r = Math.round(Q.score / Q.items.length * 100);
    stage.innerHTML = '<div class="quiz-stage"><div class="result">' +
      '<div class="score">' + Q.score + '/' + Q.items.length + '</div>' +
      '<p>' + t().rate(r) + '　' + (r === 100 ? t().res100 : r >= 70 ? t().res70 : t().res0) + '</p>' +
      '<button class="btn-main" id="againBtn">' + t().retry + '</button></div></div>';
    return;
  }
  const {d, opts} = Q.items[Q.i];
  const A = face(d, frontLang());
  const pickMsg = backLang() === "ko" ? t().quizPickKo : t().quizPickJa;
  const qHead = A.cardBig.replace('class="card-q', 'class="quiz-q').replace('class="card-sub', 'class="quiz-sub') +
                '<div class="quiz-sub">' + pickMsg + '</div>';
  const body = opts.map(o => {
    let cls = "opt";
    if(Q.answered){
      if(o.id === d.id) cls += " right";
      else if(o.id === Q.chosen) cls += " wrong";
    }
    return '<button class="' + cls + '" data-opt="' + o.id + '"' + (Q.answered ? " disabled" : "") + '>' +
           face(o, backLang()).opt + '</button>';
  }).join("");
  const answerText = backLang() === "ko" ? d.ko : d.ja;
  const fb = Q.answered
    ? '<div class="quiz-fb">' + (Q.chosen === d.id ? t().correct : t().answerIs(esc(answerText))) +
      ((S.showTip && tipOf(d)) ? " " + esc(tipOf(d)) : "") + '</div>' +
      '<div class="card-bar"><button class="know" id="nextQ">' + t().quizNext + '</button>' +
      '<button data-speak="' + d.id + '">' + t().listen + '</button></div>'
    : '<div class="quiz-fb"></div>';
  stage.innerHTML = '<div class="quiz-stage">' +
    '<div class="quiz-top"><span>' + (Q.i + 1) + ' / ' + Q.items.length + '</span><span>' +
    (S.ui === "ja" ? "正解 " : "정답 ") + Q.score + '</span></div>' + qHead + body + fb + '</div>';
}

function render(){
  if(S.mode === "list") renderList();
  else if(S.mode === "card") renderCard();
  else renderQuiz();
  updateMeter();
}
function updateMeter(){
  const list = visible();
  const d = list.filter(x => S.done.has(x.id)).length;
  $("meterLabel").textContent = t().meter(d, list.length);
  $("meterFill").style.width = (list.length ? d / list.length * 100 : 0) + "%";
  $("footRight").textContent = t().count(list.length, S.favs.size);
}

/* ==========================================================
   8. UIテキストの反映
   ========================================================== */
function applyLang(){
  const L = t();
  document.documentElement.lang = S.ui === "ja" ? "ja" : "ko";
  $("subtitle").textContent = L.sub(DATA.length);
  $("lblLearner").textContent = L.learner;
  $("uiSubJa").textContent = L.uiSubJa;
  $("uiSubKo").textContent = L.uiSubKo;
  $("lblDir").textContent = L.dirLabel;
  $("dirA").textContent = L.dirA; $("dirAs").textContent = L.dirAs;
  $("dirB").textContent = L.dirB; $("dirBs").textContent = L.dirBs;
  const m = $("modeSwitch").children;
  m[0].textContent = L.mList; m[1].textContent = L.mCard; m[2].textContent = L.mQuiz;
  $("q").placeholder = L.search;
  $("maskBtn").textContent = L.mask;
  $("shuffleBtn").textContent = L.shuffle;
  $("tipBtn").textContent = S.showTip ? L.tipOff : L.tipOn;
  $("resetBtn").textContent = L.reset;
  $("autoBtn").textContent = S.auto ? L.stop : L.auto;
  const vm = $("voiceMode").children; vm[0].textContent = L.vTarget; vm[1].textContent = L.vBoth;
  const en = $("engine").children; en[0].textContent = L.eGoogle; en[1].textContent = L.eAuto; en[2].textContent = L.eLocal;
  $("helpPanel").innerHTML = L.help;
  $("footLeft").textContent = S.mode === "card" ? L.footCard : S.mode === "quiz" ? L.footQuiz : L.footList;
  [...$("cats").children].forEach(b => {
    const c = CATS.find(x => x.key === b.dataset.cat);
    if(c) b.textContent = c[S.ui];
  });
  refreshAudioStatus();
}

/* ==========================================================
   9. 操作
   ========================================================== */
function toggleFav(id){
  S.favs.has(id) ? S.favs.delete(id) : S.favs.add(id);
  store.set("kj_favs", [...S.favs]);
  render();
}
function toggleDone(id){
  S.done.has(id) ? S.done.delete(id) : S.done.add(id);
  store.set("kj_done", [...S.done]);
  render();
}
function stepCard(n){
  const len = visible().length;
  if(!len) return;
  S.cardIdx = (S.cardIdx + n + len) % len;
  S.cardOpen = false;
  render();
}

stage.addEventListener("click", e => {
  const b = e.target.closest("button");
  const item = id => DATA.find(d => d.id === Number(id));
  if(!b){
    if(S.mode === "card" && e.target.closest("#flip")){ S.cardOpen = !S.cardOpen; render(); }
    return;
  }
  if(b.dataset.fav) return toggleFav(Number(b.dataset.fav));
  if(b.dataset.done) return toggleDone(Number(b.dataset.done));
  if(b.dataset.open){ S.revealed.add(Number(b.dataset.open)); return render(); }
  if(b.dataset.play){
    stopAuto();
    document.querySelectorAll(".entry.playing").forEach(x => x.classList.remove("playing"));
    const row = $("e" + b.dataset.play);
    if(row) row.classList.add("playing");
    return speakItem(item(b.dataset.play), () => row && row.classList.remove("playing"));
  }
  if(b.dataset.speak) return speakItem(item(b.dataset.speak));
  if(b.id === "revealBtn"){ S.cardOpen = true; return render(); }
  if(b.dataset.grade){
    const d = visible()[S.cardIdx];
    if(b.dataset.grade === "1") S.done.add(d.id); else S.done.delete(d.id);
    store.set("kj_done", [...S.done]);
    return stepCard(1);
  }
  if(b.dataset.step) return stepCard(Number(b.dataset.step));
  if(b.dataset.opt && S.quiz && !S.quiz.answered){
    const Q = S.quiz, cur = Q.items[Q.i];
    Q.answered = true; Q.chosen = Number(b.dataset.opt);
    if(Q.chosen === cur.d.id){ Q.score++; S.done.add(cur.d.id); store.set("kj_done", [...S.done]); }
    renderQuiz(); updateMeter();
    return speak(tLang() === "ko" ? cur.d.ko : cur.d.ja, tLang());
  }
  if(b.id === "nextQ"){ S.quiz.i++; S.quiz.answered = false; S.quiz.chosen = null; return renderQuiz(); }
  if(b.id === "againBtn") return startQuiz();
});

$("cats").innerHTML = CATS.map(c =>
  '<button data-cat="' + c.key + '" aria-pressed="' + (c.key === "all") + '"></button>').join("");
$("cats").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  stopAuto();
  S.cat = b.dataset.cat; S.cardIdx = 0; S.cardOpen = false; S.quiz = null; S.revealed.clear();
  [...$("cats").children].forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});

$("uiSwitch").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  stopAuto();
  S.ui = b.dataset.ui; store.set("kj_ui", S.ui);
  S.cardOpen = false; S.quiz = null; S.revealed.clear();
  [...$("uiSwitch").children].forEach(x => x.setAttribute("aria-pressed", x === b));
  $("tipBtn").setAttribute("aria-pressed", S.showTip);
  applyLang();
  render();
});

$("dirSwitch").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  stopAuto();
  S.dir = b.dataset.dir;
  S.cardOpen = false; S.quiz = null; S.revealed.clear();
  [...$("dirSwitch").children].forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});

$("modeSwitch").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  stopAuto();
  S.mode = b.dataset.mode;
  if(S.mode === "quiz") S.quiz = null;
  [...$("modeSwitch").children].forEach(x => x.setAttribute("aria-pressed", x === b));
  $("footLeft").textContent = S.mode === "card" ? t().footCard : S.mode === "quiz" ? t().footQuiz : t().footList;
  render();
});

$("q").addEventListener("input", e => {
  stopAuto();
  S.q = e.target.value; S.cardIdx = 0; S.cardOpen = false; S.quiz = null;
  render();
});
$("maskBtn").addEventListener("click", () => {
  S.masked = !S.masked; S.revealed.clear();
  $("maskBtn").setAttribute("aria-pressed", S.masked);
  render();
});
$("shuffleBtn").addEventListener("click", () => {
  S.shuffled = !S.shuffled;
  if(S.shuffled) reshuffle();
  $("shuffleBtn").setAttribute("aria-pressed", S.shuffled);
  S.cardIdx = 0; S.cardOpen = false;
  render();
});
$("tipBtn").addEventListener("click", () => {
  S.showTip = !S.showTip;
  $("tipBtn").setAttribute("aria-pressed", S.showTip);
  $("tipBtn").textContent = S.showTip ? t().tipOff : t().tipOn;
  render();
});
$("resetBtn").addEventListener("click", () => {
  if(!confirm(t().resetAsk)) return;
  S.done.clear(); S.favs.clear();
  store.set("kj_done", []); store.set("kj_favs", []);
  render();
});
$("helpBtn").addEventListener("click", () => $("helpPanel").classList.toggle("open"));

/* ---------- 連続再生 ---------- */
function stopAuto(){
  S.auto = false;
  stopAudio();
  document.querySelectorAll(".entry.playing").forEach(x => x.classList.remove("playing"));
  $("autoBtn").textContent = t().auto;
  $("autoBtn").classList.remove("on");
  refreshAudioStatus();
}
function startAuto(){
  const list = visible();
  if(!list.length) return;
  S.auto = true;
  S.autoPos = S.mode === "card" ? S.cardIdx : 0;
  $("autoBtn").textContent = t().stop;
  $("autoBtn").classList.add("on");
  autoStep();
}
function autoStep(){
  if(!S.auto) return;
  const list = visible();
  if(S.autoPos >= list.length) return stopAuto();
  const d = list[S.autoPos];
  if(S.mode === "list"){
    document.querySelectorAll(".entry.playing").forEach(x => x.classList.remove("playing"));
    const row = $("e" + d.id);
    if(row){ row.classList.add("playing"); row.scrollIntoView({behavior:"smooth", block:"center"}); }
  }else if(S.mode === "card"){
    S.cardIdx = S.autoPos; S.cardOpen = true; render();
  }
  speakItem(d, () => {
    if(!S.auto) return;
    S.autoPos++;
    setTimeout(autoStep, 550);
  });
}
$("autoBtn").addEventListener("click", () => {
  unlockSpeech();
  if(S.mode === "quiz"){ setStatus(t().aQuiz, true); return; }
  S.auto ? stopAuto() : startAuto();
});
["voiceMode","rate","engine"].forEach(id => $(id).addEventListener("change", () => { stopAuto(); refreshAudioStatus(); }));

/* ---------- キーボード ---------- */
document.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if(S.mode !== "card") return;
  if(e.code === "Space"){ e.preventDefault(); S.cardOpen = !S.cardOpen; render(); }
  else if(e.key === "ArrowRight") stepCard(1);
  else if(e.key === "ArrowLeft") stepCard(-1);
  else if((e.key === "1" || e.key === "2") && S.cardOpen){
    const d = visible()[S.cardIdx];
    if(e.key === "1") S.done.add(d.id); else S.done.delete(d.id);
    store.set("kj_done", [...S.done]);
    stepCard(1);
  }
});

/* ---------- 起動 ---------- */
$("tipBtn").setAttribute("aria-pressed", S.showTip);
[...$("uiSwitch").children].forEach(x => x.setAttribute("aria-pressed", x.dataset.ui === S.ui));
reshuffle();
applyLang();
render();
</script>
</body>
</html>
